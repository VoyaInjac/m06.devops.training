version: v1.0
name: "Terraform S3 Pipeline"

agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404

fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'

blocks:
  - name: "Initialize"
    dependencies: []
    task:
      secrets:
        - name: localstack
      jobs:
        - name: "Terraform Init"
          commands:
            - checkout
            - cd 1-terraform-apply
            - terraform init
            - artifact push workflow .terraform
            - artifact push workflow .terraform.lock.hcl

  - name: "Deploy"
    dependencies: ["Initialize"]
    task:
      secrets:
        - name: localstack
      jobs:
        - name: "Terraform Apply"
          commands:
            - checkout
            - cd 1-terraform-apply
            - artifact pull workflow .terraform --force
            - artifact pull workflow .terraform.lock.hcl --force
            - chmod -R +x .terraform/
            - terraform validate
            - terraform apply -auto-approve
            - artifact push workflow terraform.tfstate --force

  - name: "Use Bucket"
    dependencies: ["Deploy"]
    task:
      secrets:
        - name: localstack
      jobs:
        - name: "S3 Operations"
          commands:
            - checkout
            - cd 1-terraform-apply
            - aws s3 cp README.md s3://vinjac-devops-training-bucket/
            - aws s3 ls s3://vinjac-devops-training-bucket
            - aws s3 rm s3://vinjac-devops-training-bucket/README.md

  - name: "Deploy EC2"
    dependencies: ["Initialize"]
    task:
      secrets:
        - name: localstack
      jobs:
        - name: "Terraform Apply EC2"
          commands:
            - checkout
            - cd 2-terraform-ec2
            - artifact pull workflow .terraform --force
            - artifact pull workflow .terraform.lock.hcl --force
            - chmod -R +x .terraform/
            - terraform validate
            - terraform apply -auto-approve
            - artifact push workflow terraform.tfstate --force

  - name: "Destroy EC2"
    dependencies: ["Deploy EC2"]
    task:
      secrets:
        - name: localstack
      jobs:
        - name: "Terraform Destroy EC2"
          commands:
            - checkout
            - cd 2-terraform-ec2
            - artifact pull workflow .terraform --force
            - artifact pull workflow .terraform.lock.hcl --force
            - artifact pull workflow terraform.tfstate --force
            - chmod -R +x .terraform/
            - terraform destroy -auto-approve

  - name: "Destroy"
    dependencies: ["Use Bucket"]
    task:
      secrets:
        - name: localstack
      jobs:
        - name: "Terraform Destroy"
          commands:
            - checkout
            - cd 1-terraform-apply
            - artifact pull workflow .terraform --force
            - artifact pull workflow .terraform.lock.hcl --force
            - artifact pull workflow terraform.tfstate --force
            - chmod -R +x .terraform/
            - terraform destroy -auto-approve
